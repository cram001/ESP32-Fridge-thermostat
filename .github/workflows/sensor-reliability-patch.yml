name: Apply sensor reliability hardening
on:
  push:
    branches: [agent/v0.11.1-transactional-edit-status-banners]
    paths: [.github/workflows/sensor-reliability-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners
      - name: Harden DS18B20 discovery and freshness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # hardware_config.h: shorter direct-bus rescan cadence, read freshness,
          # remove unchanged-value heuristic, bump firmware.
          p = Path('include/hardware_config.h')
          s = p.read_text()
          s = s.replace('constexpr uint32_t kSensorRescanIntervalMs = 30UL * 1000UL;\nconstexpr uint8_t kSensorDiscoveryConfirmations = 2;\n// Advisory fault when a valid probe reports no meaningful raw-temperature\n// change for a prolonged period. 10-bit DS18B20 readings are quantized to\n// 0.25 C, so 0.20 C cleanly recognizes a one-count change.\nconstexpr uint32_t kTemperatureStuckTimeoutMs = 30UL * 60UL * 1000UL;\nconstexpr float kTemperatureStuckChangeC = 0.20f;\n',
          'constexpr uint32_t kSensorRescanIntervalMs = 5UL * 1000UL;\nconstexpr uint8_t kSensorDiscoveryConfirmations = 2;\n// Sensor input is considered healthy only while recent CRC-valid samples keep\n// arriving. Two transient failures are tolerated; the third failed 5-second\n// sample, or 15 seconds without a good sample, marks the role read-failed.\nconstexpr uint8_t kSensorReadFailureLimit = 3;\nconstexpr uint32_t kSensorFreshnessTimeoutMs = 15UL * 1000UL;\n')
          s = s.replace('constexpr char kFirmwareVersion[] = "v0.12.8";', 'constexpr char kFirmwareVersion[] = "v0.12.9";')
          p.write_text(s)

          # Fault codes/messages: replace unreliable unchanged-temperature faults
          # with concrete assigned-sensor read failures.
          p = Path('include/fault_manager.h')
          s = p.read_text().replace('  kFridgeStuck,\n  kFreezerStuck,\n  kAmbientStuck\n',
                                    '  kFridgeReadFailed,\n  kFreezerReadFailed,\n  kAmbientReadFailed\n')
          p.write_text(s)
          p = Path('src/fault_manager.cpp')
          s = p.read_text().replace('    {FaultCode::kFridgeStuck, "Fridge temp not changing"},\n    {FaultCode::kFreezerStuck, "Freezer temp not changing"},\n    {FaultCode::kAmbientStuck, "Ambient temp not changing"},\n',
                                    '    {FaultCode::kFridgeReadFailed, "Fridge sensor read failed"},\n    {FaultCode::kFreezerReadFailed, "Freezer sensor read failed"},\n    {FaultCode::kAmbientReadFailed, "Ambient sensor read failed"},\n')
          p.write_text(s)

          # TemperatureManager header: add health tracker and read-failed status.
          p = Path('include/temperature_manager.h')
          s = p.read_text()
          s = s.replace('#include "hardware_config.h"\n', '#include "hardware_config.h"\n#include "sensor_health_tracker.h"\n')
          s = s.replace('enum class SensorStatus : uint8_t { kOk, kMissing, kOutOfRange };',
                        'enum class SensorStatus : uint8_t { kOk, kMissing, kReadFailed, kOutOfRange };')
          s = s.replace('  void collect(const String assigned_rom[kRoleCount],\n               const float calibration_c[kRoleCount]);',
                        '  void collect(const String assigned_rom[kRoleCount],\n               const float calibration_c[kRoleCount], uint32_t now);')
          marker = '  SensorStatus role_status_[kRoleCount] = {\n      SensorStatus::kMissing, SensorStatus::kMissing, SensorStatus::kMissing};\n'
          if marker not in s: raise SystemExit('temperature_manager status marker not found')
          s = s.replace(marker, marker + '  SensorHealthTracker role_health_[kRoleCount];\n')
          p.write_text(s)

          # TemperatureManager implementation: true OneWire search, per-device
          # resolution setup, and freshness/read-failure handling.
          p = Path('src/temperature_manager.cpp')
          s = p.read_text()
          old_scan = re.search(r'bool TemperatureManager::scan_sensors\(uint32_t now, bool force\) \{.*?\n\}\n\nvoid TemperatureManager::begin\(\)', s, re.S)
          if not old_scan: raise SystemExit('scan_sensors block not found')
          new_scan = r'''bool TemperatureManager::scan_sensors(uint32_t now, bool force) {
  if (!force &&
      now - last_discovery_scan_ms_ < hw::kSensorRescanIntervalMs) {
    return false;
  }
  last_discovery_scan_ms_ = now;

  DeviceAddress found[kMaxSensors] = {};
  uint8_t found_count = 0;
  DeviceAddress address;

  // Search the OneWire bus directly. DallasTemperature's device count is
  // cached by begin(), so using getDeviceCount()/getAddress() cannot reliably
  // discover probes connected after boot. Validate ROM CRC and accept only the
  // DS18B20 family used by this controller.
  one_wire_.reset_search();
  while (found_count < kMaxSensors && one_wire_.search(address)) {
    if (OneWire::crc8(address, 7) != address[7]) continue;
    if (address[0] != 0x28) continue;
    copy_rom(found[found_count], address);
    ++found_count;
  }
  one_wire_.reset_search();

  // Stable ordering keeps detectedProbeN paths from shuffling when the OneWire
  // search returns the same devices in a different order.
  for (uint8_t i = 1; i < found_count; ++i) {
    DeviceAddress key;
    copy_rom(key, found[i]);
    int j = static_cast<int>(i) - 1;
    while (j >= 0 && compare_rom(found[j], key) > 0) {
      copy_rom(found[j + 1], found[j]);
      --j;
    }
    copy_rom(found[j + 1], key);
  }

  if (force) {
    apply_discovery(found, found_count);
    discovery_candidate_count_ = 0;
    discovery_candidate_confirmations_ = 0;
    return true;
  }

  if (discovery_matches(found, found_count)) {
    discovery_candidate_count_ = 0;
    discovery_candidate_confirmations_ = 0;
    return false;
  }

  if (candidate_matches(found, found_count)) {
    if (discovery_candidate_confirmations_ < 255) {
      ++discovery_candidate_confirmations_;
    }
  } else {
    discovery_candidate_count_ = found_count;
    for (uint8_t i = 0; i < found_count; ++i) {
      copy_rom(discovery_candidate_[i], found[i]);
    }
    discovery_candidate_confirmations_ = 1;
  }

  if (discovery_candidate_confirmations_ <
      hw::kSensorDiscoveryConfirmations) {
    return false;
  }

  apply_discovery(discovery_candidate_, discovery_candidate_count_);
  discovery_candidate_count_ = 0;
  discovery_candidate_confirmations_ = 0;
  return true;
}

void TemperatureManager::begin()'''
          s = s[:old_scan.start()] + new_scan + s[old_scan.end():]

          # New probes may power up at 12-bit resolution. Configure every newly
          # committed address to 10-bit so the nonblocking 190ms delay remains valid.
          old_apply = '''  if (changed) discovery_changed_ = true;\n}\n'''
          new_apply = '''  if (changed) {\n    for (uint8_t i = 0; i < detected_count_; ++i) {\n      bus_.setResolution(detected_roms_[i], 10, true);\n    }\n    discovery_changed_ = true;\n  }\n}\n'''
          if old_apply not in s: raise SystemExit('apply_discovery tail not found')
          s = s.replace(old_apply, new_apply, 1)

          s = s.replace('  collect(assigned_rom, calibration_c);\n', '  collect(assigned_rom, calibration_c, now);\n')
          start = s.index('void TemperatureManager::collect(const String assigned_rom[kRoleCount],')
          s = s[:start] + r'''void TemperatureManager::collect(const String assigned_rom[kRoleCount],
                                 const float calibration_c[kRoleCount],
                                 uint32_t now) {
  for (uint8_t i = 0; i < detected_count_; ++i) {
    const float value = bus_.getTempC(detected_roms_[i]);
    if (value == DEVICE_DISCONNECTED_C ||
        !std::isfinite(value) ||
        fabsf(value - hw::kDs18b20PowerOnResetC) < 0.01f) {
      detected_temp_c_[i] = NAN;
    } else {
      detected_temp_c_[i] = value;
    }
  }

  for (uint8_t role = 0; role < kRoleCount; ++role) {
    const char* assigned = assigned_rom[role].c_str();
    if (strcasecmp(filter_rom_[role], assigned) != 0 ||
        filter_calibration_c_[role] != calibration_c[role]) {
      reset_filter(role);
      role_health_[role].reset();
      snprintf(filter_rom_[role], sizeof(filter_rom_[role]), "%s", assigned);
      filter_calibration_c_[role] = calibration_c[role];
    }

    if (assigned[0] == 0) {
      role_status_[role] = SensorStatus::kMissing;
      role_health_[role].reset();
      reset_filter(role);
      continue;
    }

    int8_t matched_sensor = -1;
    for (uint8_t sensor = 0; sensor < detected_count_; ++sensor) {
      char sensor_rom[17];
      rom_to_chars(detected_roms_[sensor], sensor_rom);
      if (strcasecmp(assigned, sensor_rom) == 0) {
        matched_sensor = static_cast<int8_t>(sensor);
        break;
      }
    }

    if (matched_sensor < 0) {
      role_status_[role] = SensorStatus::kMissing;
      role_health_[role].reset();
      reset_filter(role);
      continue;
    }

    const float raw = detected_temp_c_[matched_sensor];
    if (!std::isfinite(raw)) {
      const bool expired = role_health_[role].note_failure(
          now, hw::kSensorReadFailureLimit, hw::kSensorFreshnessTimeoutMs);
      if (expired) {
        role_status_[role] = SensorStatus::kReadFailed;
        reset_filter(role);
      } else {
        // Keep the most recent known-good filtered/raw value during a brief
        // CRC/read glitch. It remains explicitly bounded by the freshness timer.
        role_status_[role] = SensorStatus::kOk;
      }
      continue;
    }

    const float calibrated = raw + calibration_c[role];
    if (calibrated < -55.0f || calibrated > 85.0f) {
      role_status_[role] = SensorStatus::kOutOfRange;
      role_health_[role].reset();
      reset_filter(role);
      continue;
    }

    role_health_[role].note_good(now);
    role_raw_temp_c_[role] = calibrated;
    role_status_[role] = SensorStatus::kOk;
    add_filter_sample(role, calibrated);
  }
}
'''
          # Ensure reset_filter clears both filtered and raw values when a role
          # actually becomes invalid.
          s = s.replace('  role_temp_c_[role] = NAN;\n}', '  role_temp_c_[role] = NAN;\n  role_raw_temp_c_[role] = NAN;\n}', 1)
          p.write_text(s)

          # main.cpp: remove unchanged-value monitor state/hot path and expose
          # concrete read-failed faults.
          p = Path('src/main.cpp')
          s = p.read_text()
          s = re.sub(r'\n// Advisory stuck-value monitor\..*?bool temperature_stuck\[3\] = \{false, false, false\};\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\nvoid update_temperature_stuck_monitor\(uint32_t now\) \{.*?\n\}\n\nvoid publish_detected_probe_metadata',
                     '\nvoid publish_detected_probe_metadata', s, count=1, flags=re.S)
          s = s.replace('  const uint32_t now = millis();\n  fridge_c = temperatures.role_temperature(0);',
                        '  fridge_c = temperatures.role_temperature(0);')
          s = s.replace('  update_temperature_stuck_monitor(now);\n', '')
          old_faults = '''  faults.set(FaultCode::kFridgeStuck,\n             fridge_status == Status::kOk && temperature_stuck[0]);\n  faults.set(FaultCode::kFreezerStuck,\n             freezer_status == Status::kOk && temperature_stuck[1]);\n  faults.set(FaultCode::kAmbientStuck,\n             ambient_status == Status::kOk && temperature_stuck[2]);\n'''
          new_faults = '''  faults.set(FaultCode::kFridgeReadFailed,\n             fridge_status == Status::kReadFailed);\n  faults.set(FaultCode::kFreezerReadFailed,\n             freezer_status == Status::kReadFailed);\n  faults.set(FaultCode::kAmbientReadFailed,\n             ambient_status == Status::kReadFailed);\n'''
          if old_faults not in s: raise SystemExit('main stuck fault block not found')
          s = s.replace(old_faults, new_faults, 1)
          p.write_text(s)

          # Native runner adds freshness tests.
          p = Path('tools/run-native-tests.sh')
          s = p.read_text()
          if 'sensor_health_tests.cpp' not in s:
            s += 'compile_and_run sensor_health_tests.cpp sensor-health-tests\n'
          p.write_text(s)

          # Failure simulation: remove the invalid unchanged-temperature heuristic
          # and document the remaining hardware blind spot honestly.
          p = Path('test/native/failure_mode_tests.cpp')
          s = p.read_text()
          s = re.sub(r'\nstruct StuckTemperatureMonitor \{.*?\n\};\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\nvoid test_stuck_temperature_advisory_timing\(\) \{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'void test_compressor_failure_with_stuck_cold_freezer_probe\(\) \{.*?\n\}\n',
          '''void test_compressor_failure_with_stuck_cold_freezer_probe() {\n  FirmwareSim sim;\n  const float reported_freezer_c = -10.0f;\n  for (uint32_t minute = 0; minute <= 35; ++minute) {\n    const uint32_t now = 1000 + minute * 60UL * 1000UL;\n    sim.step(now, 8.0f, reported_freezer_c, true, true);\n  }\n\n  limitation(!sim.output.freezer_lockout && !sim.temperature_alarm,\n             "a CRC-valid, plausible but physically wrong freezer reading cannot be distinguished from a genuinely stable freezer without independent feedback");\n}\n''', s, count=1, flags=re.S)
          s = s.replace('  test_stuck_temperature_advisory_timing();\n', '')
          p.write_text(s)

          # Failure-mode documentation: remove claims that unchanged temperature
          # is itself a fault and describe the freshness/CRC model instead.
          p = Path('docs/FAILURE_MODE_ANALYSIS.md')
          s = p.read_text()
          s = s.replace('| Valid probe unchanged ~30 min | `temp not changing` advisory | User is warned | Reading remains usable for control because it may still be physically valid |\n', '')
          s = s.replace('| Compressor failure + freezer probe stuck plausibly cold | 30-minute unchanged-temperature advisory | User is warned about suspicious probe | **Cold false reading can mask freezer warming until independent observation** |\n',
                        '| Compressor failure + freezer probe stuck plausibly cold | Reading remains apparently valid if communication/CRC are good | None from temperature alone | **Cold false reading can mask freezer warming until independent observation** |\n')
          s = s.replace('Ambient temperature is informational and does not participate in refrigeration\ncontrol. Missing/range/stuck conditions should therefore remain advisory faults\nrather than changing fan behavior.\n\n### Plausible but frozen sensor value\n\nA disconnected DS18B20 is normally reported as invalid, but a sensor or data\npath can theoretically remain at one plausible value. The firmware therefore\nraises an advisory if a valid raw reading fails to move by one 10-bit DS18B20\nmeasurement step for approximately 30 minutes.\n\nThe advisory does not automatically reject the reading. A compartment can\nlegitimately remain extremely stable, so treating this as a hard sensor failure\nwould create false fail-safe transitions. For the fridge or freezer probe, the\nwarning triangle and Active Errors entry tell the user to investigate.\n',
                        'Ambient temperature is informational and does not participate in refrigeration\ncontrol. Missing, read-failed, and range conditions remain advisory faults rather\nthan changing fan behavior. A stable cabin temperature is not a fault: repeated\nCRC-valid samples remain healthy even if the numeric value is unchanged for hours.\n\n### Sensor input validity and freshness\n\nEach assigned role is healthy only while its ROM is present and recent valid\nsamples continue to arrive. DallasTemperature validates the scratchpad CRC; the\nfirmware also rejects the DS18B20 +85 C power-on value and implausible range. Two\ntransient failed 5-second reads are tolerated using the most recent good sample.\nA third failed read, or 15 seconds without a good sample, changes the role to\n`read failed`. One subsequent good sample recovers automatically.\n\nNumeric movement is deliberately not a validity requirement. A refrigerator,\nfreezer, or cabin can legitimately remain on the same 0.25 C 10-bit reading for\nhours, so an unchanged-value alarm produces false positives and is not used.\n')
          s = s.replace('A plausible cold reading can prevent lockout and freezer high-temperature alarm\neven while the real freezer warms. The 30-minute unchanged-temperature advisory\nis the only available software indication until another measured quantity\nchanges. Independent compressor/fan/current/temperature feedback would be\nrequired to make this condition fully deterministic.\n',
                        'A plausible cold reading can prevent lockout and freezer high-temperature alarm\neven while the real freezer warms. If the sensor continues returning CRC-valid\ndata, software cannot reliably distinguish a physically stuck or misplaced probe\nfrom a genuinely stable freezer. Independent compressor/fan/current/temperature\nfeedback would be required to make this condition fully deterministic.\n')
          p.write_text(s)

          # Remove temporary workflow itself after applying the patch.
          Path('.github/workflows/sensor-reliability-patch.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden DS18B20 discovery and sample freshness"
          git push
