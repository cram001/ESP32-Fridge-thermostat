name: PlatformIO firmware build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build FireBeetle firmware
        run: pio run -e firebeetle2_esp32e_n16r2
