name: Clean encoder gauge removal
on:
  push:
    branches:
      - agent/v0.11.1-transactional-edit-status-banners
    paths:
      - .github/workflows/cleanup-encoder-gauge-removal.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners
      - name: Remove dead gauge code
        run: |
          echo '' | base64 -d > /tmp/cleanup_encoder.py
          python3 /tmp/cleanup_encoder.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean removed encoder gauge code"
          git push
