name: Apply incremental encoder architecture

on:
  push:
    branches:
      - agent/v0.11.1-transactional-edit-status-banners
    paths:
      - .github/workflows/apply-encoder-incremental-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners
      - name: Apply patch
        run: python3 tools/apply_encoder_incremental_fix.py
      - name: Commit patch
        run: |
          rm .github/workflows/apply-encoder-incremental-fix.yml
          rm tools/apply_encoder_incremental_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp .github/workflows/apply-encoder-incremental-fix.yml tools/apply_encoder_incremental_fix.py
          git commit -m "Stop rewriting encoder gauge during rotation"
          git push
