name: Apply home layout adjustment

on:
  push:
    branches:
      - agent/v0.11.1-transactional-edit-status-banners
    paths:
      - .github/workflows/home-layout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners

      - name: Adjust home screen spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/fridge_display.cpp')
          s = p.read_text()
          s = s.replace('oled_.drawStr(x + 2, y + 25, role_labels[left_role]);',
                        'oled_.drawStr(x + 2, y + 23, role_labels[left_role]);')
          s = s.replace('oled_.drawStr(x + 66, y + 25, role_labels[right_role]);',
                        'oled_.drawStr(x + 66, y + 23, role_labels[right_role]);')
          s = s.replace('draw_hero_temperature(x + 2, y + 46, model.role_temp_c[left_role],',
                        'draw_hero_temperature(x + 2, y + 49, model.role_temp_c[left_role],')
          s = s.replace('draw_hero_temperature(x + 66, y + 46, model.role_temp_c[right_role],',
                        'draw_hero_temperature(x + 66, y + 49, model.role_temp_c[right_role],')
          p.write_text(s)
          PY

          git rm .github/workflows/home-layout-patch.yml
          git config user.name "cram001"
          git config user.email "marcarchambault@gmail.com"
          git add src/fridge_display.cpp
          git commit -m "Adjust home temperature row spacing"
          git push origin HEAD:agent/v0.11.1-transactional-edit-status-banners
