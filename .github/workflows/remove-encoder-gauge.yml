name: Remove encoder LED gauge behavior
on:
  push:
    branches: [agent/v0.11.1-transactional-edit-status-banners]
    paths: [.github/workflows/remove-encoder-gauge.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners
      - name: Restore stable encoder behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.cpp')
          s = p.read_text()

          s = s.replace('#include "encoder_delta_filter.h"\n', '')
          s = s.replace('EncoderDeltaFilter encoder_delta_filter;\n', '')
          s = s.replace('uint8_t encoder_gain = hw::kEncoderNavigationGain;\nuint16_t encoder_baseline_value = hw::kEncoderNeutralValue;\n', '')

          # Remove all LED/gauge mapping helpers. Keep option_index(), which is used by normal settings editing.
          start = s.index('bool setting_supports_encoder_gauge(uint8_t setting) {')
          end = s.index('void set_encoder_navigation_mode() {', start)
          s = s[:start] + s[end:]

          old = '''void set_encoder_navigation_mode() {
  if (!encoder_available) return;
  encoder_gain = hw::kEncoderNavigationGain;
  encoder_baseline_value = hw::kEncoderNeutralValue;
  encoder.setGainCoefficient(encoder_gain);
  encoder.setEncoderValue(encoder_baseline_value);
  encoder_delta_filter.program_baseline(encoder_baseline_value, encoder_gain);
  encoder_counterclockwise_substeps = 0;
}
'''
          new = '''void set_encoder_navigation_mode() {
  if (!encoder_available) return;
  encoder.setGainCoefficient(hw::kEncoderNavigationGain);
  encoder.setEncoderValue(hw::kEncoderNeutralValue);
  encoder_counterclockwise_substeps = 0;
}
'''
          if old not in s:
              raise SystemExit('navigation mode block not found')
          s = s.replace(old, new, 1)

          # Remove the gauge-mode function completely.
          s = re.sub(r'\nvoid set_encoder_gauge_mode\(\) \{.*?\n\}\n\nint32_t read_encoder_delta\(\) \{',
                     '\nint32_t read_encoder_delta() {', s, count=1, flags=re.S)

          old = '''int32_t read_encoder_delta() {
  const int32_t position = encoder.getEncoderValue();
  return encoder_delta_filter.decode(position);
}
'''
          new = '''int32_t read_encoder_delta() {
  const int32_t position = encoder.getEncoderValue();
  const int32_t delta =
      position - static_cast<int32_t>(hw::kEncoderNeutralValue);
  if (delta != 0) {
    encoder.setEncoderValue(hw::kEncoderNeutralValue);
  }
  return delta;
}
'''
          if old not in s:
              raise SystemExit('read encoder block not found')
          s = s.replace(old, new, 1)

          old = '''  if (raw_button_down) {
    encoder_counterclockwise_substeps = 0;
  }
'''
          new = '''  if (raw_button_down) {
    encoder.setEncoderValue(hw::kEncoderNeutralValue);
    encoder_counterclockwise_substeps = 0;
  }
'''
          if old not in s:
              raise SystemExit('button block not found')
          s = s.replace(old, new, 1)

          s = s.replace('    if (menu_editing || encoder_gain != hw::kEncoderNavigationGain) {\n',
                        '    if (menu_editing) {\n')

          old = '''        if (selected_setting != 14) capture_edit_snapshot();
        menu_editing = true;
        edit_changed = false;
        if (setting_supports_encoder_gauge(selected_setting)) {
          set_encoder_gauge_mode();
        } else {
          set_encoder_navigation_mode();
        }
'''
          new = '''        if (selected_setting != 14) capture_edit_snapshot();
        menu_editing = true;
        edit_changed = false;
        // Use the same proven gain-1 detent handling for editing as for menu
        // navigation. The SEN0502 LED gauge is intentionally disabled.
        set_encoder_navigation_mode();
'''
          if old not in s:
              raise SystemExit('edit entry block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          # Hardware config: remove gauge constants/comments and bump version.
          p = Path('include/hardware_config.h')
          s = p.read_text()
          s = re.sub(r'// Gauge mode chooses a gain per setting.*?constexpr uint16_t kEncoderGaugeMaxValue = 969;\n', '', s, count=1, flags=re.S)
          s = s.replace('// This SEN0502 reports two counterclockwise transitions per detent on this\n// hardware. After gain-scaled count changes are converted back to raw detent\n// transitions, these two transitions are collapsed to one menu/edit step.\n',
                        '// This SEN0502 reports two counterclockwise transitions per detent on this\n// hardware; collapse those two transitions to one menu/edit step.\n')
          s = s.replace('constexpr char kFirmwareVersion[] = "v0.12.5";',
                        'constexpr char kFirmwareVersion[] = "v0.12.6";')
          p.write_text(s)

          # Documentation: explicitly record that LED gauge behavior was removed.
          Path('docs/encoder-led-note.md').write_text('''# SEN0502 encoder LEDs\n\nThe SEN0502 ring is tied to the encoder module\'s internal count and the DFRobot\nAPI does not provide independent LED control. Attempts to use that count as a\nsetting-value gauge caused inconsistent detent handling and count/readback races\non the physical hardware.\n\nFirmware therefore **does not use the LED ring as a setting gauge**. Menu\nnavigation and value editing both use the same stable gain-1 encoder behavior,\nwith the count returned to a small neutral value after movement. The ring is\nleft effectively inactive.\n\nCounterclockwise movement on this hardware produces two transitions per physical\ndetent; firmware retains the proven compensation that collapses those two\ntransitions into one menu/edit step. Runtime I2C health is checked periodically;\nif the encoder disappears, an in-progress edit is rolled back and the encoder is\nreinitialized automatically when it reconnects.\n''')

          # The gain-aware filter and its tests are no longer part of the design.
          Path('include/encoder_delta_filter.h').unlink(missing_ok=True)
          Path('test/native/encoder_filter_tests.cpp').unlink(missing_ok=True)
          p = Path('tools/run-native-tests.sh')
          s = p.read_text().replace('compile_and_run encoder_filter_tests.cpp encoder-filter-tests\n', '')
          p.write_text(s)
          PY

          rm .github/workflows/remove-encoder-gauge.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore stable encoder editing without LED gauge"
          git push
