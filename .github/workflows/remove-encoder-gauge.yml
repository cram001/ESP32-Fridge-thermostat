name: Remove encoder LED gauge behavior
on:
  push:
    branches:
      - agent/v0.11.1-transactional-edit-status-banners
    paths:
      - .github/workflows/remove-encoder-gauge.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.11.1-transactional-edit-status-banners
      - name: Restore stable encoder behavior
        run: |
          echo '' | base64 -d > /tmp/remove_encoder_gauge.py
          python3 /tmp/remove_encoder_gauge.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore stable encoder editing without LED gauge"
          git push
