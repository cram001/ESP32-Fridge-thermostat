[platformio]
default_envs = firebeetle2_esp32e_n16r2

[env:firebeetle2_esp32e_n16r2]
platform = espressif32 @ 6.9.0
board = dfrobot_firebeetle2_esp32e
framework = arduino

monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

lib_deps =
    SignalK/SensESP @ 3.4.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    olikraus/U8g2 @ 2.36.5
    knolleary/PubSubClient @ 2.8

build_flags =
    -D USE_ESP_IDF_LOG
    -D CORE_DEBUG_LEVEL=3
    -D TAG='"Fridge"'

monitor_filters = esp32_exception_decoder


; ---------------------------------------------------------------------------
; FIRMWARE UPLOAD METHOD
;
; USB upload:
;   Comment out the OTA lines below. PlatformIO will normally detect the USB
;   serial port automatically.
;
; Wi-Fi OTA upload:
;   Leave the OTA lines enabled and set upload_port to the ESP32's current IP.
;
; OTA is provided by SensESP's builder via enable_ota("esp32!"). The explicit
; repository-owned partition table provides two equal 5 MiB OTA application
; slots plus otadata. Do not add a separate ArduinoOTA.begin() path.
; ---------------------------------------------------------------------------

;uncomment below for USB upload
;upload_protocol = esptool


;uncomment below for wifi OTA

upload_protocol = espota
upload_port = 192.168.88.205
upload_flags =
    --auth=esp32!
    --port=3232
