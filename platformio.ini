[platformio]
default_envs = firebeetle2_esp32e_n16r2

[env:firebeetle2_esp32e_n16r2]
platform = espressif32 @ 6.9.0
board = dfrobot_firebeetle2_esp32e
framework = arduino

monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv

lib_deps =
    SignalK/SensESP @ 3.4.0
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    olikraus/U8g2 @ 2.36.5
    knolleary/PubSubClient @ 2.8

build_flags =
    -D USE_ESP_IDF_LOG
    -D CORE_DEBUG_LEVEL=3
    -D TAG='"Fridge"'

monitor_filters = esp32_exception_decoder


; ---------------------------------------------------------------------------
; FIRMWARE UPLOAD METHOD
;
; USB upload:
;   Leave the OTA lines below commented out.
;   PlatformIO will normally detect the USB serial port automatically.
;
; Wi-Fi OTA upload:
;   Uncomment the four OTA settings below and set upload_port to the ESP32's
;   current IP address.
;
; IMPORTANT:
;   OTA only works after firmware with OTA support has already been installed
;   by USB at least once.
;
;   --timeout below is the espota invitation/connection timeout. The firmware
;   separately increases ArduinoOTA's receive timeout during the transfer and
;   temporarily disables Wi-Fi modem sleep to tolerate brief packet stalls.
; ---------------------------------------------------------------------------
;
upload_protocol = espota
upload_port = 192.168.88.205
upload_flags =
     --auth=esp32!
     --port=3232
     --timeout=120
